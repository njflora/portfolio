<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background matching your card surface -->
  <rect width="32" height="32" rx="6" fill="#1E1E1E"/>
  
  <!-- "N.F" in white with the final period in copper -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Space Grotesk', sans-serif" 
    font-weight="700" 
    font-size="15">
    <tspan fill="#FFFFFF">N.F</tspan><tspan fill="#C87533">.</tspan>
  </text>
</svg>